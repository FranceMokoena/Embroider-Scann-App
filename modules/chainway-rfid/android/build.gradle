plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.embroiderytech.chainwayrfid'
version = '3.2.0'

android {
  namespace "com.embroiderytech.chainwayrfid"

  defaultConfig {
    versionCode 5
    versionName "3.2.0"
  }
}

repositories {
  flatDir {
    dirs 'libs'
  }
}

dependencies {
  implementation fileTree(dir: "libs", include: ["*.aar", "*.jar"])
}
